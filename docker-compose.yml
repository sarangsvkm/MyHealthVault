services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: myhealthvault
      POSTGRES_USER: myhealthvault
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_dev_change_me}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myhealthvault -d myhealthvault"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./backend/myhealthvault-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/myhealthvault
      SPRING_DATASOURCE_USERNAME: myhealthvault
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-local_dev_change_me}
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-secret-32-characters-minimum}
      APP_STORAGE_DIR: /var/myhealthvault/files
      ABDM_MODE: ${ABDM_MODE:-disabled}
    volumes:
      - healthfiles:/var/myhealthvault/files
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  healthfiles:
